<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#063e35"><meta name="description" content="Jaiho Tasdik demo app">
<title>Jaiho Tasdik</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" class="screen splash">
  <div class="brand-mark">JT</div><h1>Jaiho Tasdik</h1><p>Play • Explore • Enjoy</p>
  <div class="loader"><span></span></div><small>Loading…</small>
</div>
<div id="app" class="app hidden">
  <header class="topbar"><div class="mini-logo">JT</div><div class="brand">Jaiho Tasdik</div><div class="balance">₹0.37 <button onclick="show('deposit')">＋</button></div><button class="menu" onclick="toggleMenu()">☰</button></header>
  <main id="content"></main>
  <nav class="bottom"><button data-page="home" onclick="show('home')">⌂<span>Home</span></button><button data-page="games" onclick="show('games')">🎮<span>Games</span></button><button data-page="bank" onclick="show('bank')">🏦<span>Bank</span></button><button data-page="vip" onclick="show('vip')">♛<span>VIP</span></button><button data-page="mail" onclick="show('mail')">✉<span>Mail</span></button></nav>
</div>
<div id="drawer" class="drawer hidden"><button onclick="show('home')">Home</button><button onclick="show('games')">Games</button><button onclick="show('transactions')">My Transactions</button><button onclick="show('vip')">VIP</button><button onclick="show('bank')">Deposit / Withdraw</button></div>
<script src="app.js"></script>
</body></html>
