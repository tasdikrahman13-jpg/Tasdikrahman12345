<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Jaiho Tasdik — Dragon VS Tiger</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#020b18;color:#fff;font-family:Arial,sans-serif;height:100%;overflow:hidden}
button{font:inherit}
.app{height:100vh;max-width:700px;margin:auto;position:relative;overflow:hidden;background:
 radial-gradient(circle at 50% 35%,#123d72 0,#06162d 35%,#020915 80%);
}
.top{height:82px;padding:10px 12px;display:flex;align-items:center;gap:9px;background:linear-gradient(180deg,#062d32,#064f4b);border-bottom:2px solid #d5a72c}
.brand{display:flex;align-items:center;gap:7px;flex:1}
.logo{width:48px;height:48px;border-radius:12px;border:2px solid #20e8bd;background:#063b40;display:grid;place-items:center;font-weight:900;color:#8dffe8;line-height:.8}
.logo small{font-size:9px}
.title{font-weight:800;font-size:15px}.sub{font-size:10px;color:#9fe7dc;margin-top:3px}
.icon{width:45px;height:45px;border:0;border-radius:14px;background:#09bd83;color:#fff;font-size:22px;font-weight:900;box-shadow:inset 0 0 0 2px #54ffd3}
.coins{background:#063b39;border-radius:24px;padding:9px 12px;font-weight:800;white-space:nowrap}
.plus{background:#0bd391;border:0;border-radius:50%;width:40px;height:40px;color:#fff;font-size:25px}
.arena{height:calc(100vh - 82px - 88px);position:relative;overflow:hidden;padding-bottom:10px}
.game-head{display:flex;justify-content:space-between;align-items:center;padding:12px 12px 6px}
.game-name{background:linear-gradient(#0b6f6b,#043d50);border:2px solid #15e9bd;border-radius:12px;padding:7px 12px;font-weight:900}
.status{font-size:12px;color:#b9fff0}
.stage{position:relative;height:61%;min-height:430px;margin:0 12px;border:2px solid #1ed5b1;border-radius:24px;overflow:hidden;background:
 radial-gradient(circle at 28% 40%,rgba(48,214,255,.3),transparent 28%),
 radial-gradient(circle at 75% 40%,rgba(255,105,30,.28),transparent 30%),
 linear-gradient(180deg,#061d49,#061127 70%,#06162b)}
.dragon,.tiger{position:absolute;top:12%;font-size:115px;filter:drop-shadow(0 0 12px #18eaff)}
.dragon{left:5%}.tiger{right:4%;filter:drop-shadow(0 0 12px #ff7c19)}
.vs{position:absolute;top:25%;left:50%;transform:translate(-50%,-50%);font-size:54px;font-weight:1000;color:#ffd12d;text-shadow:0 4px #7b3900}
.card{position:absolute;top:22%;width:72px;height:100px;border-radius:8px;background:#fff;color:#111;display:grid;place-items:center;font-size:34px;font-weight:900;box-shadow:0 5px 14px #000}
.card.left{left:27%}.card.right{right:27%}
.red{color:#c51c26}
.history{position:absolute;top:45%;left:0;right:0;display:flex;justify-content:center;gap:5px}
.ball{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;border:1px solid #fff8}
.ball.d{background:#e98a19}.ball.t{background:#536bdc}
.table{position:absolute;bottom:8%;left:5%;right:5%;height:33%;border-radius:55% 55% 20px 20px/35% 35% 10px 10px;background:linear-gradient(90deg,#287fe0,#28b23c 49%,#e36b28);border:4px solid #f0c34c;box-shadow:0 0 0 5px #4b3422 inset}
.zone{position:absolute;top:20%;width:38%;height:60%;display:grid;place-items:center;text-align:center;font-size:20px;font-weight:900}.zone.d{left:2%}.zone.t{right:2%}.zone.tie{left:31%;width:38%;top:12%;font-size:17px}
.score{font-size:22px;margin-top:5px}
.betrow{position:absolute;bottom:2%;left:0;right:0;display:flex;justify-content:center;gap:9px}
.chip{width:60px;height:60px;border-radius:50%;border:3px solid #f9d768;color:#fff;font-weight:900;background:#173d9a;box-shadow:inset 0 0 0 5px #0b234c}
.chip:nth-child(2){background:#0d8b9e}.chip:nth-child(3){background:#7352b9}.chip:nth-child(4){background:#a35c18}.chip:active{transform:scale(.92)}
.controls{padding:8px 14px 12px;display:flex;gap:8px}
.action{flex:1;border:0;border-radius:16px;padding:13px 5px;background:linear-gradient(#19dca5,#06a878);color:#fff;font-weight:900;box-shadow:0 3px 0 #00634f}
.action.alt{background:linear-gradient(#3f80d8,#2452a4)}
.bottom{height:88px;position:absolute;bottom:0;left:0;right:0;background:#063c3a;border-top:2px solid #d5a72c;display:flex;justify-content:space-around;align-items:center}
.nav{border:0;background:transparent;color:#a7f5e7;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}.nav b{font-size:25px}.nav.active{color:#ffe05a}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal{width:100%;max-width:520px;border:3px solid #19e2b3;border-radius:24px;background:linear-gradient(#073d3d,#06252e);padding:20px;box-shadow:0 0 30px #00dba5}
.modal h2{text-align:center;margin:0 0 15px;color:#ffd84a}
.modal p{color:#d2fff6;line-height:1.5}.close{width:100%;border:0;border-radius:14px;padding:12px;background:#12c88f;color:#fff;font-weight:900}
.toast{position:absolute;top:90px;left:50%;transform:translateX(-50%);background:#071d29;border:1px solid #19e2b3;border-radius:20px;padding:9px 15px;z-index:30;display:none}
@media(max-height:700px){.stage{min-height:360px;height:58%}.dragon,.tiger{font-size:85px}.card{width:60px;height:82px;font-size:28px}.bottom{height:76px}.arena{height:calc(100vh - 82px - 76px)}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">J<br><small>T</small></div><div><div class="title">Jaiho Tasdik</div><div class="sub">Virtual Demo</div></div></div>
    <div class="coins">🪙 <span id="balance">850</span></div>
    <button class="plus" onclick="addCoins()">+</button>
    <button class="icon" onclick="openModal('menu')">☰</button>
  </header>

  <main class="arena">
    <div class="game-head"><div class="game-name">🐉 Dragon VS Tiger</div><div class="status">● LIVE DEMO</div></div>
    <section class="stage">
      <div class="dragon">🐉</div><div class="tiger">🐅</div><div class="vs">VS</div>
      <div class="card left" id="dragonCard">6♠</div>
      <div class="card right red" id="tigerCard">A♥</div>
      <div class="history" id="history"></div>
      <div class="table">
        <div class="zone d">DRAGON<div class="score" id="dscore">0</div></div>
        <div class="zone tie">TIE<div class="score" id="ties">0</div></div>
        <div class="zone t">TIGER<div class="score" id="tscore">0</div></div>
        <div class="betrow">
          <button class="chip" onclick="bet('dragon',10)">10</button>
          <button class="chip" onclick="bet('tiger',50)">50</button>
          <button class="chip" onclick="bet('tie',100)">100</button>
          <button class="chip" onclick="bet('dragon',500)">500</button>
        </div>
      </div>
    </section>
    <div class="controls">
      <button class="action" onclick="deal()">DEAL ROUND</button>
      <button class="action alt" onclick="openModal('help')">HOW TO PLAY</button>
    </div>
  </main>

  <nav class="bottom">
    <button class="nav" onclick="openModal('bank')"><b>🏦</b>Bank</button>
    <button class="nav active" onclick="deal()"><b>🎰</b>Game</button>
    <button class="nav" onclick="openModal('wheel')"><b>🎡</b>Lucky Wheel</button>
    <button class="nav" onclick="openModal('refer')"><b>🪙</b>Refer & Earn</button>
    <button class="nav" onclick="openModal('events')"><b>🎁</b>Events</button>
  </nav>

  <div class="toast" id="toast"></div>
  <div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><button class="close" onclick="closeModal()">TAP TO CLOSE</button></div>
  </div>
</div>

<script>
let balance=850, betSide=null, betAmount=0, d=0,t=0,tie=0;
const suits=['♠','♥','♦','♣'];
function toast(x){let e=document.getElementById('toast');e.textContent=x;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',1800)}
function addCoins(){balance+=100;document.getElementById('balance').textContent=balance;toast('+100 virtual coins')}
function bet(side,amount){
  if(balance<amount){toast('Not enough virtual coins');return}
  betSide=side;betAmount=amount;toast('Bet selected: '+side.toUpperCase()+' '+amount+' virtual coins');
}
function card(){return {n:Math.floor(Math.random()*13)+1,s:suits[Math.floor(Math.random()*4)]}}
function label(c){return (c.n===1?'A':c.n===11?'J':c.n===12?'Q':c.n===13?'K':c.n)+c.s}
function deal(){
  if(betSide){balance-=betAmount}
  const a=card(),b=card();let av=a.n===1?14:a.n,bv=b.n===1?14:b.n;
  document.getElementById('dragonCard').textContent=label(a);
  document.getElementById('tigerCard').textContent=label(b);
  document.getElementById('tigerCard').className='card right '+(['♥','♦'].includes(b.s)?'red':'');
  let result=av>bv?'dragon':bv>av?'tiger':'tie';
  if(result==='dragon')d++;else if(result==='tiger')t++;else tie++;
  document.getElementById('dscore').textContent=d;document.getElementById('tscore').textContent=t;document.getElementById('ties').textContent=tie;
  if(betSide){
    if(betSide===result){balance+=betAmount*2;toast('You won '+(betAmount*2)+' virtual coins!')}
    else toast('Round lost — virtual coins only');
  }
  betSide=null;betAmount=0;document.getElementById('balance').textContent=balance;
  const x=document.createElement('div');x.className='ball '+(result==='dragon'?'d':'t');x.textContent=result==='dragon'?'D':result==='tiger'?'T':'=';
  document.getElementById('history').appendChild(x);
  if(document.getElementById('history').children.length>10)document.getElementById('history').firstChild.remove();
}
function openModal(type){
 const data={
  help:['How to Play','Choose a virtual-coin chip, select Dragon, Tiger or Tie, then press DEAL ROUND. Two cards are drawn and the higher value wins. Aces are high. This is a play-money demo; there are no deposits, withdrawals or real-money prizes.'],
  bank:['Bank','Virtual demo balance: '+balance+' coins.<br><br>Use the + button to add 100 practice coins.'],
  wheel:['Lucky Wheel','Practice feature coming soon.'],
  refer:['Refer & Earn','Referral screen for the demo. No cash rewards are enabled.'],
  events:['Events','Demo events: Daily Practice • Dragon VS Tiger • 777 Slots • Ludo.'],
  menu:['Jaiho Tasdik','Game Menu<br><br>Profile • Settings • Help • Responsible Play']
 };
 document.getElementById('modalTitle').textContent=data[type][0];
 document.getElementById('modalBody').innerHTML='<p>'+data[type][1]+'</p>';
 document.getElementById('overlay').style.display='flex';
}
function closeModal(){document.getElementById('overlay').style.display='none'}
setTimeout(()=>toast('Welcome to Jaiho Tasdik'),700);
</script>
</body>
</html>
